# https://taskfile.dev/styleguide/
# Avoid chaining commands with ; or && in a single line. Use multiple cmd items for independent steps, or write a script under scripts/ instead.

version: '3'

tasks:
  default:
    deps:
      - task: lint
      - task: test
      - task: build
      - task: list
  check:
    deps:
      - task: default
  install:
    cmds:
      - go install -ldflags "-X main.commit=$(git rev-parse HEAD)"
  build:preview:
    cmds:
      - goreleaser build --snapshot --single-target --clean --output dist/selfup
  build:
    cmds:
      - go build -o ./dist/selfup ./cmd/selfup
  run:
    cmds:
      - git ls-files -z -- examples ':!:*beta*' | xargs --null go run ./cmd/selfup run --skip-by=do_not_update_this_file
  list:
    cmds:
      - git ls-files -z -- examples ':!:*beta*' | xargs --null go run ./cmd/selfup list --skip-by=do_not_update_this_file
  update:
    cmds:
      - nix flake update --commit-lock-file
      - nix develop --command go run ./cmd/selfup run .github/workflows/*.yml
      - git diff-index --quiet HEAD || git commit -m 'Update CI dependencies with adjusting to nixpkgs' .github
  update-vendor-hash:
    cmds:
      - nix-update selfup --version=skip --flake
  test:
    cmds:
      - go test ./...
  fmt:
    cmds:
      - dprint fmt
      - go fmt ./...
  lint:
    # go fmt does not have option for no effect - https://github.com/golang/go/issues/41189
    cmds:
      - dprint check
      - go vet ./...
      - goreleaser check
      - typos . .github
      - zizmor .
