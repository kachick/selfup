name: 'Setup Nix and Cachix'
description: 'Installs Nix and configures Cachix for caching'
inputs:
  cachix-auth-token:
    description: 'Authentication token for Cachix'
    required: false
    default: ''
  skip-push:
    description: 'Set to true to only pull from the cache without pushing any build results'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Install Nix
      uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
      with:
        # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
        extra-conf: |
          access-tokens = github.com=${{ github.token }}

    - name: Configure Cachix
      if: inputs.cachix-auth-token != ''
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: selfup
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ inputs.skip-push }}
