name: Bump flake.lock and related dependencies
on:
  schedule:
    # Every 10:17(JST) on Monday
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      PR_BRANCH: bot-update-flake-lock
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Generate GitHub Apps token
        id: publish-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SAMU_APP_ID }}
          private-key: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.publish-token.outputs.token }}
          # This workflow depends on stored credentials for the subsequent git push command
          persist-credentials: true
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          # access-tokens: Prevent GitHub API rate limiting during `nix run github:`
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
      - name: Prepare Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${PR_BRANCH}"
      - name: Update flake.lock and commit them
        run: nix flake update --commit-lock-file
      - name: Update related CI dependencies
        run: |
          nix run .#update-deps
          git diff-index --quiet HEAD || git commit -m 'Sync CI dependencies with nixpkgs' .github
      - name: Push branch and create PR
        env:
          GITHUB_TOKEN: ${{ steps.publish-token.outputs.token }}
        run: |
          count="$(git rev-list --count "origin/${DEFAULT_BRANCH}..")"
          if [ "$count" -gt 0 ]; then
            echo "Found ${count} commit(s). Pushing to ${PR_BRANCH}..."
            git push origin "${PR_BRANCH}" --force

            if ! gh pr view "${PR_BRANCH}" --json state --jq .state 2>/dev/null | grep -q "OPEN"; then
              gh pr create \
                --base "${DEFAULT_BRANCH}" \
                --head "${PR_BRANCH}" \
                --title 'Bump flake.lock and related dependencies' \
                --body 'This PR was generated automatically.'
            fi
          else
            echo "No commits added. Nothing to push or create."
          fi
