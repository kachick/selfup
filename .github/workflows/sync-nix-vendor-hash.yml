name: 🔄 Sync Nix vendorHash
# Why schedule sweep instead of pull_request or workflow_run:
# - pull_request triggered by bots (Dependabot, Renovate) cannot access repository
#   secrets (SAMU_APP_PRIVATE_KEY) to generate a GitHub App token without bot secrets.
# - workflow_run executes with access to repository secrets, but is flagged as
#   fundamentally insecure (dangerous-triggers) by zizmor and introduces supply
#   chain risks when checking out untrusted PR branches.
# Periodic sweeps on the default branch keep credentials in trusted repository
# contexts without silencing security warnings.
on:
  schedule:
    # Run every 2 hours at minute 15 to avoid traffic peaks and prepare bot PRs before automerge runs at minute 45
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-hash:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Generate GitHub Apps token
        id: publish-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SAMU_APP_ID }}
          private-key: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.publish-token.outputs.token }}
          persist-credentials: true

      - uses: $/.github/actions/setup-nix

      - name: Prepare Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync vendorHash for open bot PRs
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
        run: |
          set -euo pipefail

          branches=$(gh pr list \
            --state open \
            --json headRefName,author,files \
            --jq '.[] | select((.author.login == "app/dependabot" or .author.login == "app/renovate") and (.files | any(.path == "go.mod" or .path == "go.sum"))) | .headRefName')

          if [ -z "${branches}" ]; then
            echo "No open bot Go PRs found"
            exit 0
          fi

          for branch in ${branches}; do
            echo "Checking ${branch}..."
            git fetch origin "${branch}"
            git checkout -B "${branch}" "origin/${branch}"
            git reset --hard HEAD
            git clean -fd

            if [ "$(git log -1 --format=%s)" = "Bump vendorHash in go packages" ]; then
              echo "Branch ${branch} is already synced"
              continue
            fi

            before_sha=$(git rev-parse HEAD)
            nix develop --command nix-update selfup --version=skip --flake

            git ls-files --modified '**.nix' | xargs git add
            git update-index -q --really-refresh
            git diff-index --cached --quiet HEAD || git commit -m 'Bump vendorHash in go packages'

            if [ "$(git rev-parse HEAD)" != "${before_sha}" ]; then
              echo "Pushing updated vendorHash for ${branch}..."
              git push origin "${branch}"
            else
              echo "No vendorHash changes needed for ${branch}"
            fi
          done
