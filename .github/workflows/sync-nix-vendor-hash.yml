name: 🔄 Sync Nix vendorHash
# Why workflow_run instead of pull_request:
# pull_request events triggered by Dependabot cannot access repository secrets
# (SAMU_APP_PRIVATE_KEY) to generate a GitHub App token.
# Running under workflow_run executes in the default branch context where secrets
# are accessible, and pushing with the App token cleanly triggers downstream CI.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['CI - Go']
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch to sync'
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-hash:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor.login == 'dependabot[bot]' &&
       startsWith(github.event.workflow_run.head_branch, 'dependabot/go_modules/'))
    steps:
      - name: Generate GitHub Apps token
        id: publish-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SAMU_APP_ID }}
          private-key: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Determine target branch
        id: target
        env:
          INPUT_BRANCH: ${{ inputs.branch }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          branch="${INPUT_BRANCH:-$RUN_BRANCH}"
          if [ -z "${branch}" ]; then
            echo "Target branch could not be determined" >&2
            exit 1
          fi
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.publish-token.outputs.token }}
          ref: ${{ steps.target.outputs.branch }}
          persist-credentials: true

      - name: Check if already synced
        id: check-synced
        run: |
          set -euo pipefail
          initial_sha="$(git rev-parse HEAD)"
          echo "initial_sha=${initial_sha}" >> "$GITHUB_OUTPUT"
          if [ "$(git log -1 --format=%s)" = "Bump vendorHash in go packages" ]; then
            echo "Branch is already synced"
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: $/.github/actions/setup-nix
        if: steps.check-synced.outputs.synced == 'false'

      - name: Prepare Git user
        if: steps.check-synced.outputs.synced == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump vendorHash
        if: steps.check-synced.outputs.synced == 'false'
        run: |
          nix develop --command nix-update selfup --version=skip --flake

      - name: Commits
        if: steps.check-synced.outputs.synced == 'false'
        run: |
          git ls-files --modified '**.nix' | xargs git add
          git update-index -q --really-refresh
          git diff-index --quiet HEAD || git commit -m 'Bump vendorHash in go packages'

      - name: Push changes
        if: steps.check-synced.outputs.synced == 'false'
        env:
          HEAD_REF: ${{ steps.target.outputs.branch }}
          INITIAL_SHA: ${{ steps.check-synced.outputs.initial_sha }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          if [ "${CURRENT_SHA}" != "${INITIAL_SHA}" ]; then
            git push origin HEAD:"${HEAD_REF}"
          fi
