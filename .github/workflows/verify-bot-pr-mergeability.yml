name: Verify bot PR mergeability
on: pull_request

# Only read permissions needed.
# Merging is performed separately by scheduled-bot-merge.yml with GitHub App token.
# wait-other-jobs is not needed because scheduled-bot-merge checks that all PR status checks are SUCCESS.
permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'renovate[bot]' ||
      github.event.pull_request.user.login == 'samuebot[bot]'
    steps:
      - name: Dependabot metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        id: dependabot
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Check if mergeable for Dependabot
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          UPDATE_TYPE: ${{ steps.dependabot.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.dependabot.outputs.dependency-names }}
        run: |
          if [ "$UPDATE_TYPE" = 'version-update:semver-major' ] && ! echo "$DEPENDENCY_NAMES" | grep -q 'cachix'; then
            echo "::error::Dependabot major update is not eligible for auto-merge"
            exit 1
          fi
