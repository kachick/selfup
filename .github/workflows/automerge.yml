name: Automerge bot PRs
on:
  schedule:
    # Run every 2 hours at minute 17 to avoid traffic peaks
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge:
    timeout-minutes: 10
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate GitHub Apps token
        id: publish-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SAMU_APP_ID }}
          private-key: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge eligible bot PRs
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
        run: bash .github/scripts/automerge.sh
