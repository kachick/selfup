name: CI - Nix
on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - '.github/actions/setup-nix/**'
      - '.github/workflows/ci-nix.yml'
      - '*.nix'
      - 'flake.*'
      - 'go.mod'
      - 'Taskfile.yml'
      - 'examples/**'
  pull_request:
    paths:
      - '.github/actions/setup-nix/**'
      - '.github/workflows/ci-nix.yml'
      - '*.nix'
      - 'flake.*'
      - 'go.mod'
      - 'Taskfile.yml'
      - 'examples/**'
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:
    inputs:
      force-push-cache:
        description: 'Force push built packages to Cachix even if not on a release tag'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tasks:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Don't set extra-conf to test the devShell behavior
      - uses: $/.github/actions/setup-nix
      - run: nix flake check
      - run: nix develop --command echo 'This step should be done before any other "nix develop" steps because of measuring Nix build time'
      - run: nix develop --command task

  package:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
      - run: nix run . -- --version
      - name: Push to Cachix
        if: ${{ matrix.runner == 'ubuntu-26.04' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs['force-push-cache'])) && env.CACHIX_AUTH_TOKEN != '' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          nix run --inputs-from . nixpkgs#cachix -- push selfup "$(nix path-info .)"
      - name: Pin to Cachix
        if: ${{ matrix.runner == 'ubuntu-26.04' && startsWith(github.ref, 'refs/tags/v') && env.CACHIX_AUTH_TOKEN != '' }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          PIN_NAME: ${{ github.ref_name }}
        run: |
          nix run --inputs-from . nixpkgs#cachix -- pin selfup "$PIN_NAME" "$(nix path-info .)"
